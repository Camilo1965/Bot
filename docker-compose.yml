# OPTIONAL — only needed if DB_BACKEND=postgres (default).
# For zero-dep VPS install (no Docker), set in .env:
#   DB_BACKEND=sqlite
#   REDIS_BACKEND=memory
# Then run: bash scripts/install_vps_zerodep.sh

version: "3.9"

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: clawdbot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-clawdbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-clawdbot_secret}
      POSTGRES_DB: clawdbot
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
    command: >
      postgres
      -c max_connections=30
      -c shared_buffers=128MB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-clawdbot}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: clawdbot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  timescale_data:
  redis_data:
